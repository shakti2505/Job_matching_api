services:
  postgres:
    image: postgres:15-alpine
    container_name: job-match-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: job_match
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d job_match"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: job-match-api
    environment:
      PORT: 3000
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: admin
      PGPASSWORD: password123
      PGDATABASE: job_match
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: